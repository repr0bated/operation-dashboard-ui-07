syntax = "proto3";

package operation.method.login1.unlock_session;

import "google/protobuf/descriptor.proto";
import "google/protobuf/struct.proto";

extend google.protobuf.MethodOptions {
  string plugin_subid = 50000;
  string required_capability = 50001;
}

message UnlockSessionInput {
  string session_id = 1;
}

message UnlockSessionOutput {
  bool success = 1;
}

service UnlockSessionService {
  // subid: mut.software.login1.session.unlock@v1, capability: login1.write
  rpc unlock_session(UnlockSessionInput) returns (UnlockSessionOutput);
}
