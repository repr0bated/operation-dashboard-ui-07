syntax = "proto3";

package operation.method.wgcf.refresh;

import "google/protobuf/descriptor.proto";
import "google/protobuf/struct.proto";

extend google.protobuf.MethodOptions {
  string plugin_subid = 50000;
  string required_capability = 50001;
}

message RefreshInput {
  string refresh_type = 156878944;
}

message RefreshOutput {
  bool success = 442482449;
}

service RefreshService {
  // subid: mut.software.wgcf.refresh@v1, capability: wgcf.write
  rpc refresh(RefreshInput) returns (RefreshOutput);
}
