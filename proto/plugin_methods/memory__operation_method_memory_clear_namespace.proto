syntax = "proto3";

package operation.method.memory.clear_namespace;

import "google/protobuf/descriptor.proto";
import "google/protobuf/struct.proto";

extend google.protobuf.MethodOptions {
  string plugin_subid = 50000;
  string required_capability = 50001;
}

message ClearNamespaceInput {
  string name = 1;
}

message ClearNamespaceOutput {
  int64 deleted_entries = 1;
  bool success = 2;
}

service ClearNamespaceService {
  // subid: mut.memory.memory.clear-namespace@v1, capability: memory.namespace.clear
  rpc clear_namespace(ClearNamespaceInput) returns (ClearNamespaceOutput);
}
