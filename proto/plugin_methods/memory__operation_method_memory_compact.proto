syntax = "proto3";

package operation.method.memory.compact;

import "google/protobuf/descriptor.proto";
import "google/protobuf/struct.proto";

extend google.protobuf.MethodOptions {
  string plugin_subid = 50000;
  string required_capability = 50001;
}

message CompactInput {
  double min_threshold = 459163614;
  string namespace = 181303974;
}

message CompactOutput {
  double fragmentation_level = 157845343;
  int64 freed_bytes = 531510497;
  bool success = 442482449;
}

service CompactService {
  // subid: mut.memory.memory.compact@v1, capability: memory.memory.compact
  rpc compact(CompactInput) returns (CompactOutput);
}
