syntax = "proto3";

package operation.method.btrfs.list_subvolumes;

import "google/protobuf/descriptor.proto";
import "google/protobuf/struct.proto";

extend google.protobuf.MethodOptions {
  string plugin_subid = 50000;
  string required_capability = 50001;
}

message ListSubvolumesInput {
  string path = 1;
}

message ListSubvolumesOutput {
  repeated google.protobuf.Value subvolumes = 1;
}

service ListSubvolumesService {
  // subid: obs.storage.btrfs.subvolume.list@v1, capability: cap.storage.btrfs.subvolume.list@v1
  rpc list_subvolumes(ListSubvolumesInput) returns (ListSubvolumesOutput);
}
