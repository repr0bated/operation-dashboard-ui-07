syntax = "proto3";


package operation.method.json_render.get_spec_schema;

import "google/protobuf/descriptor.proto";
import "google/protobuf/struct.proto";

extend google.protobuf.MethodOptions {
  string plugin_subid = 50000;
  string required_capability = 50001;
}

message GetSpecSchemaInput {
  // Empty schema object.
}

message GetSpecSchemaOutput {
  google.protobuf.Value spec_contract = 1;
}

service GetSpecSchemaService {
  // subid: obs.software.plugin.json-render.spec.get@v1, capability: json_render.read
  rpc get_spec_schema(GetSpecSchemaInput) returns (GetSpecSchemaOutput);
}


