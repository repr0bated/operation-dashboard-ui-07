syntax = "proto3";


package operation.method.incus.start_instance;

import "google/protobuf/descriptor.proto";
import "google/protobuf/struct.proto";

extend google.protobuf.MethodOptions {
  string plugin_subid = 50000;
  string required_capability = 50001;
}

message StartInstanceInput {
  string name = 1;
}

message StartInstanceOutput {
  bool success = 1;
}

service StartInstanceService {
  // subid: mut.service.incus.instance.start@v1, capability: cap.service.incus.instance.start@v1
  rpc start_instance(StartInstanceInput) returns (StartInstanceOutput);
}


