syntax = "proto3";

package operation.method.btrfs.device_add;

import "google/protobuf/descriptor.proto";
import "google/protobuf/struct.proto";

extend google.protobuf.MethodOptions {
  string plugin_subid = 50000;
  string required_capability = 50001;
}

message DeviceAddInput {
  string device = 275805945;
  string path = 75975994;
}

message DeviceAddOutput {
  bool success = 442482449;
}

service DeviceAddService {
