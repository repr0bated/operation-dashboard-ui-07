syntax = "proto3";

package operation.method.ovsdb_bridge.remove_port;

import "google/protobuf/descriptor.proto";
import "google/protobuf/struct.proto";

extend google.protobuf.MethodOptions {
  string plugin_subid = 50000;
  string required_capability = 50001;
}

message RemovePortInput {
  string bridge = 179832343;
  string port = 467931817;
}

message RemovePortOutput {
  bool success = 442482449;
}

service RemovePortService {
