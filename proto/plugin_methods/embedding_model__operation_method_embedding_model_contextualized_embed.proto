syntax = "proto3";

package operation.method.embedding_model.contextualized_embed;

import "google/protobuf/descriptor.proto";
import "google/protobuf/struct.proto";

extend google.protobuf.MethodOptions {
  string plugin_subid = 50000;
  string required_capability = 50001;
}

message ContextualizedEmbedInput {
  google.protobuf.Value input_type = 94319076;
  repeated string inputs = 397855130;
  string model = 277571167;
  int64 output_dimension = 473512300;
  google.protobuf.Value output_dtype = 197886601;
}

message ContextualizedEmbedOutput {
  string chunker_version = 407433220;
  repeated google.protobuf.Value results = 206523128;
  int64 total_tokens = 20838375;
}

service ContextualizedEmbedService {
  // subid: mut.service.embedding.contextualized-embed@v1, capability: embedding.invoke
  rpc contextualized_embed(ContextualizedEmbedInput) returns (ContextualizedEmbedOutput);
}
