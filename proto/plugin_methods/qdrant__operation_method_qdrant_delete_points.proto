syntax = "proto3";

package operation.method.qdrant.delete_points;

import "google/protobuf/descriptor.proto";
import "google/protobuf/struct.proto";

extend google.protobuf.MethodOptions {
  string plugin_subid = 50000;
  string required_capability = 50001;
}

message DeletePointsInput {
  string collection_name = 1;
  repeated google.protobuf.Value points = 2;
}

message DeletePointsOutput {}

service DeletePointsService {
  // subid: mut.data.qdrant.point.delete@v1, capability: cap.data.qdrant.point.delete@v1
  rpc delete_points(DeletePointsInput) returns (DeletePointsOutput);
}
