syntax = "proto3";


package operation.method.unix_socket.listen;

import "google/protobuf/descriptor.proto";
import "google/protobuf/struct.proto";

extend google.protobuf.MethodOptions {
  string plugin_subid = 50000;
  string required_capability = 50001;
}

message ListenInput {
  int64 backlog = 1;
  string path = 2;
}

message ListenOutput {
  bool success = 1;
}

service ListenService {
  // subid: mut.service.unix-socket.listen@v1, capability: network.write
  rpc listen(ListenInput) returns (ListenOutput);
}


