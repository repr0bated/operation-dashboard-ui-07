syntax = "proto3";

package operation.method.web_ui.render_page;

import "google/protobuf/descriptor.proto";
import "google/protobuf/struct.proto";

extend google.protobuf.MethodOptions {
  string plugin_subid = 50000;
  string required_capability = 50001;
}

message RenderPageInput {
  string locale = 1;
  string page_id = 2;
}

message RenderPageOutput {
  bool success = 1;
}

service RenderPageService {
  // subid: obs.software.plugin.web-ui.render-page@v1, capability: ui.read
  rpc render_page(RenderPageInput) returns (RenderPageOutput);
}
