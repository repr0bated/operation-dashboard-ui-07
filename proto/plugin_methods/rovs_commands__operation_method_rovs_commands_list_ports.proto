syntax = "proto3";

package operation.method.rovs_commands.list_ports;

import "google/protobuf/descriptor.proto";
import "google/protobuf/struct.proto";

extend google.protobuf.MethodOptions {
  string plugin_subid = 50000;
  string required_capability = 50001;
}

message ListPortsInput {
  string bridge_name = 1;
}

message ListPortsOutput {}

service ListPortsService {
  // subid: obs.network.ovsdb.port.list@v1, capability: cap.network.ovsdb.port.list@v1
  rpc list_ports(ListPortsInput) returns (ListPortsOutput);
}
