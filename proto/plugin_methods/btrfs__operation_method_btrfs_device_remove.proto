syntax = "proto3";

package operation.method.btrfs.device_remove;

import "google/protobuf/descriptor.proto";
import "google/protobuf/struct.proto";

extend google.protobuf.MethodOptions {
  string plugin_subid = 50000;
  string required_capability = 50001;
}

message DeviceRemoveInput {
  string device = 1;
  string path = 2;
}

message DeviceRemoveOutput {
  bool success = 1;
}

service DeviceRemoveService {
  // subid: mut.storage.btrfs.device.remove@v1, capability: cap.storage.btrfs.device.remove@v1
  rpc device_remove(DeviceRemoveInput) returns (DeviceRemoveOutput);
}
