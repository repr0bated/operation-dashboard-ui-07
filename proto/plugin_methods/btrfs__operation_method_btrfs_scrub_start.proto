syntax = "proto3";

package operation.method.btrfs.scrub_start;

import "google/protobuf/descriptor.proto";
import "google/protobuf/struct.proto";

extend google.protobuf.MethodOptions {
  string plugin_subid = 50000;
  string required_capability = 50001;
}

message ScrubStartInput {
  string path = 1;
}

message ScrubStartOutput {
  bool success = 1;
}

service ScrubStartService {
  // subid: mut.storage.btrfs.scrub.start@v1, capability: cap.storage.btrfs.scrub.start@v1
  rpc scrub_start(ScrubStartInput) returns (ScrubStartOutput);
}
