syntax = "proto3";


package operation.method.users.delete_user;

import "google/protobuf/descriptor.proto";
import "google/protobuf/struct.proto";

extend google.protobuf.MethodOptions {
  string plugin_subid = 50000;
  string required_capability = 50001;
}

message DeleteUserInput {
  bool remove_home = 1;
  string username = 2;
}

message DeleteUserOutput {
  bool success = 1;
}

service DeleteUserService {
  // subid: mut.software.plugin.users.delete@v1, capability: users.write
  rpc delete_user(DeleteUserInput) returns (DeleteUserOutput);
}


