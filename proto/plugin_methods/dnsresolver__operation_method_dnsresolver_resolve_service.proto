syntax = "proto3";

package operation.method.dnsresolver.resolve_service;

import "google/protobuf/descriptor.proto";
import "google/protobuf/struct.proto";

extend google.protobuf.MethodOptions {
  string plugin_subid = 50000;
  string required_capability = 50001;
}

message ResolveServiceInput {
  int64 family = 1;
  int64 flags = 2;
  int64 ifindex = 3;
  string name = 4;
}

message ResolveServiceOutput {}

service ResolveServiceService {
  // subid: obs.software.dnsresolver.service.resolve@v1, capability: dnsresolver.read
  rpc resolve_service(ResolveServiceInput) returns (ResolveServiceOutput);
}
