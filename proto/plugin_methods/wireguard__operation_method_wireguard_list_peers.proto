syntax = "proto3";


package operation.method.wireguard.list_peers;

import "google/protobuf/descriptor.proto";
import "google/protobuf/struct.proto";

extend google.protobuf.MethodOptions {
  string plugin_subid = 50000;
  string required_capability = 50001;
}

message ListPeersInput {
  string interface = 1;
}

message ListPeersOutput {
  repeated google.protobuf.Value peers = 1;
}

service ListPeersService {
  // subid: obs.network.wireguard.peers.list@v1, capability: wireguard.read
  rpc list_peers(ListPeersInput) returns (ListPeersOutput);
}


