syntax = "proto3";

package operation.method.packagekit.get_updates;

import "google/protobuf/descriptor.proto";
import "google/protobuf/struct.proto";

extend google.protobuf.MethodOptions {
  string plugin_subid = 50000;
  string required_capability = 50001;
}

message GetUpdatesInput {
  int64 filter = 1;
}

message GetUpdatesOutput {
  bool success = 1;
}

service GetUpdatesService {
  // subid: obs.software.packagekit.updates.get@v1, capability: packagekit.read
  rpc get_updates(GetUpdatesInput) returns (GetUpdatesOutput);
}
