syntax = "proto3";

package operation.method.ovsdb_bridge.get_schema;

import "google/protobuf/descriptor.proto";
import "google/protobuf/struct.proto";

extend google.protobuf.MethodOptions {
  string plugin_subid = 50000;
  string required_capability = 50001;
}

message GetSchemaInput {
  string db_name = 1;
}

message GetSchemaOutput {}

service GetSchemaService {
  // subid: obs.network.ovsdb.schema.get@v1, capability: ovsdb.read
  rpc get_schema(GetSchemaInput) returns (GetSchemaOutput);
}
