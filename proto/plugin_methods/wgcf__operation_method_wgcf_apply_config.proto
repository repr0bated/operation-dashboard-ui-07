syntax = "proto3";

package operation.method.wgcf.apply_config;

import "google/protobuf/descriptor.proto";
import "google/protobuf/struct.proto";

extend google.protobuf.MethodOptions {
  string plugin_subid = 50000;
  string required_capability = 50001;
}

message ApplyConfigInput {
  string config = 67069640;
  bool immediate = 305276545;
}

message ApplyConfigOutput {
  bool success = 442482449;
}

service ApplyConfigService {
  // subid: mut.software.wgcf.config.apply@v1, capability: wgcf.write
  rpc apply_config(ApplyConfigInput) returns (ApplyConfigOutput);
}
