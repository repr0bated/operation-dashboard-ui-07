syntax = "proto3";

package operation.method.login1.get_seat;

import "google/protobuf/descriptor.proto";
import "google/protobuf/struct.proto";

extend google.protobuf.MethodOptions {
  string plugin_subid = 50000;
  string required_capability = 50001;
}

message GetSeatInput {
  string seat_id = 1;
}

message GetSeatOutput {}

service GetSeatService {
  // subid: obs.software.login1.seat.get@v1, capability: login1.read
  rpc get_seat(GetSeatInput) returns (GetSeatOutput);
}
