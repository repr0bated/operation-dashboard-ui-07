syntax = "proto3";

package operation.method.login1.suspend;

import "google/protobuf/descriptor.proto";
import "google/protobuf/struct.proto";

extend google.protobuf.MethodOptions {
  string plugin_subid = 50000;
  string required_capability = 50001;
}

message SuspendInput {
  bool interactive = 1;
}

message SuspendOutput {}

service SuspendService {
  // subid: mut.software.login1.system.suspend@v1, capability: login1.admin
  rpc suspend(SuspendInput) returns (SuspendOutput);
}
