syntax = "proto3";

package operation.method.netmaker.update_node;

import "google/protobuf/descriptor.proto";
import "google/protobuf/struct.proto";

extend google.protobuf.MethodOptions {
  string plugin_subid = 50000;
  string required_capability = 50001;
}

message UpdateNodeInput {
  string network = 1;
  string node_id = 2;
  google.protobuf.Value payload = 3;
}

message UpdateNodeOutput {
  bool success = 1;
}

service UpdateNodeService {
  // subid: mut.network.netmaker.node.update@v1, capability: cap.network.netmaker.node.update@v1
  rpc update_node(UpdateNodeInput) returns (UpdateNodeOutput);
}
