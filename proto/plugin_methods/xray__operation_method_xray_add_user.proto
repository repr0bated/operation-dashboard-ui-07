syntax = "proto3";

package operation.method.xray.add_user;

import "google/protobuf/descriptor.proto";
import "google/protobuf/struct.proto";

extend google.protobuf.MethodOptions {
  string plugin_subid = 50000;
  string required_capability = 50001;
}

message AddUserInput {
  string email = 176640971;
  string protocol = 455607740;
}

message AddUserOutput {
  bool success = 442482449;
}

service AddUserService {
  // subid: mut.software.plugin.xray.user.add@v1, capability: xray.write
  rpc add_user(AddUserInput) returns (AddUserOutput);
}
