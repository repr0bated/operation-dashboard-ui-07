syntax = "proto3";

package operation.method.s6_systemctl.is_enabled;

import "google/protobuf/descriptor.proto";
import "google/protobuf/struct.proto";

extend google.protobuf.MethodOptions {
  string plugin_subid = 50000;
  string required_capability = 50001;
}

message IsEnabledInput {
  string name = 1;
}

message IsEnabledOutput {
  bool enabled = 1;
}

service IsEnabledService {
  // subid: obs.software.s6.systemctl.is_enabled@v1, capability: s6.systemctl.read
  rpc is_enabled(IsEnabledInput) returns (IsEnabledOutput);
}
