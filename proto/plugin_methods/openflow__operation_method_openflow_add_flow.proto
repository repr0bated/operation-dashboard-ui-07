syntax = "proto3";

package operation.method.openflow.add_flow;

import "google/protobuf/descriptor.proto";
import "google/protobuf/struct.proto";

extend google.protobuf.MethodOptions {
  string plugin_subid = 50000;
  string required_capability = 50001;
}

message AddFlowInput {
  repeated google.protobuf.Value actions = 364201577;
  string bridge = 179832343;
  int64 cookie = 396837058;
  int64 hard_timeout = 408086100;
  int64 idle_timeout = 144399552;
  google.protobuf.Struct match_fields = 405770232;
  int64 priority = 350544653;
  int64 table = 178035681;
}

message AddFlowOutput {
  bool success = 442482449;
}

service AddFlowService {
  // subid: mut.network.openflow.flow.add@v1, capability: openflow.write
  rpc add_flow(AddFlowInput) returns (AddFlowOutput);
}
