syntax = "proto3";

package operation.method.gemma_brain.route;

import "google/protobuf/descriptor.proto";
import "google/protobuf/struct.proto";

extend google.protobuf.MethodOptions {
  string plugin_subid = 50000;
  string required_capability = 50001;
}

message RouteInput {
  // Empty schema object.
}

message RouteOutput {
  google.protobuf.Value route = 1;
}

service RouteService {
  // subid: mut.service.gemma.route@v1, capability: gemma.invoke
  rpc route(RouteInput) returns (RouteOutput);
}
