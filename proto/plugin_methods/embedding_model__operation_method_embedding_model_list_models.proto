syntax = "proto3";

package operation.method.embedding_model.list_models;

import "google/protobuf/descriptor.proto";
import "google/protobuf/struct.proto";

extend google.protobuf.MethodOptions {
  string plugin_subid = 50000;
  string required_capability = 50001;
}

message ListModelsInput {
  // Empty schema object.
}

message ListModelsOutput {
  repeated string models = 1;
}

service ListModelsService {
  // subid: obs.service.embedding.model.list@v1, capability: embedding.read
  rpc list_models(ListModelsInput) returns (ListModelsOutput);
}
