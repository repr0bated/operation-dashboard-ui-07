syntax = "proto3";

package operation.method.login1.kill_session;

import "google/protobuf/descriptor.proto";
import "google/protobuf/struct.proto";

extend google.protobuf.MethodOptions {
  string plugin_subid = 50000;
  string required_capability = 50001;
}

message KillSessionInput {
  string session_id = 1;
  int64 signal_number = 2;
  string who = 3;
}

message KillSessionOutput {
  bool success = 1;
}

service KillSessionService {
  // subid: mut.software.login1.session.kill@v1, capability: login1.write
  rpc kill_session(KillSessionInput) returns (KillSessionOutput);
}
