syntax = "proto3";

package operation.method.notebooklm.get_health;

import "google/protobuf/descriptor.proto";
import "google/protobuf/struct.proto";

extend google.protobuf.MethodOptions {
  string plugin_subid = 50000;
  string required_capability = 50001;
}

message GetHealthInput {
  // Empty schema object.
}

message GetHealthOutput {
  bool success = 1;
}

service GetHealthService {
  // subid: obs.service.plugin.notebooklm.health@v1, capability: notebooklm.read
  rpc get_health(GetHealthInput) returns (GetHealthOutput);
}
