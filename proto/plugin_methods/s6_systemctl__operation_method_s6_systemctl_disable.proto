syntax = "proto3";


package operation.method.s6_systemctl.disable;

import "google/protobuf/descriptor.proto";
import "google/protobuf/struct.proto";

extend google.protobuf.MethodOptions {
  string plugin_subid = 50000;
  string required_capability = 50001;
}

message DisableInput {
  string name = 1;
}

message DisableOutput {
  bool success = 1;
}

service DisableService {
  // subid: mut.software.s6.systemctl.disable@v1, capability: s6.systemctl.write
  rpc disable(DisableInput) returns (DisableOutput);
}


