syntax = "proto3";

package operation.method.dnsresolver.resolve_hostname;

import "google/protobuf/descriptor.proto";
import "google/protobuf/struct.proto";

extend google.protobuf.MethodOptions {
  string plugin_subid = 50000;
  string required_capability = 50001;
}

message ResolveHostnameInput {
  int64 family = 303891499;
  int64 flags = 476543536;
  int64 ifindex = 394788143;
  string name = 221887978;
}

message ResolveHostnameOutput {
  bool success = 442482449;
}

service ResolveHostnameService {
  // subid: obs.software.dnsresolver.hostname.resolve@v1, capability: dnsresolver.read
  rpc resolve_hostname(ResolveHostnameInput) returns (ResolveHostnameOutput);
}
