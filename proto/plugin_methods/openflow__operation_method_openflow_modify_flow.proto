syntax = "proto3";


package operation.method.openflow.modify_flow;

import "google/protobuf/descriptor.proto";
import "google/protobuf/struct.proto";

extend google.protobuf.MethodOptions {
  string plugin_subid = 50000;
  string required_capability = 50001;
}

message ModifyFlowInput {
  repeated google.protobuf.Value actions = 1;
  string bridge = 2;
  google.protobuf.Struct match_fields = 3;
  int64 priority = 4;
}

message ModifyFlowOutput {
  bool success = 1;
}

service ModifyFlowService {
  // subid: mut.network.openflow.flow.modify@v1, capability: openflow.write
  rpc modify_flow(ModifyFlowInput) returns (ModifyFlowOutput);
}


