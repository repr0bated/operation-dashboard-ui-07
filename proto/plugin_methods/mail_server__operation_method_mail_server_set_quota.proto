syntax = "proto3";

package operation.method.mail_server.set_quota;

import "google/protobuf/descriptor.proto";
import "google/protobuf/struct.proto";

extend google.protobuf.MethodOptions {
  string plugin_subid = 50000;
  string required_capability = 50001;
}

message SetQuotaInput {
  string domain = 1;
  int64 quota_mb = 2;
  string user = 3;
}

message SetQuotaOutput {}

service SetQuotaService {
  // subid: mut.service.mail.quota.set@v1, capability: mail.write
  rpc set_quota(SetQuotaInput) returns (SetQuotaOutput);
}
