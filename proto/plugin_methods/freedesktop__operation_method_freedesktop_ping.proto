syntax = "proto3";

package operation.method.freedesktop.ping;

import "google/protobuf/descriptor.proto";
import "google/protobuf/struct.proto";

extend google.protobuf.MethodOptions {
  string plugin_subid = 50000;
  string required_capability = 50001;
}

message PingInput {
  // Empty schema object.
}

message PingOutput {
  bool success = 1;
}

service PingService {
  // subid: obs.software.freedesktop.ping@v1, capability: freedesktop.read
  rpc Ping(PingInput) returns (PingOutput);
}
