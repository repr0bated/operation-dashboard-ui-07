syntax = "proto3";


package operation.method.cognitive_mcp.restart_service;

import "google/protobuf/descriptor.proto";
import "google/protobuf/struct.proto";

extend google.protobuf.MethodOptions {
  string plugin_subid = 50000;
  string required_capability = 50001;
}

message RestartServiceInput {
  // Empty schema object.
}

message RestartServiceOutput {
  string message = 1;
  bool success = 2;
}

service RestartServiceService {
  // subid: mut.service.cognitive-mcp.restart@v1, capability: cognitive_mcp.invoke
  rpc restart_service(RestartServiceInput) returns (RestartServiceOutput);
}


