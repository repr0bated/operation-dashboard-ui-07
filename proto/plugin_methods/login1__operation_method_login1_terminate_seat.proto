syntax = "proto3";


package operation.method.login1.terminate_seat;

import "google/protobuf/descriptor.proto";
import "google/protobuf/struct.proto";

extend google.protobuf.MethodOptions {
  string plugin_subid = 50000;
  string required_capability = 50001;
}

message TerminateSeatInput {
  string seat_id = 1;
}

message TerminateSeatOutput {
  bool success = 1;
}

service TerminateSeatService {
  // subid: mut.software.login1.seat.terminate@v1, capability: login1.admin
  rpc terminate_seat(TerminateSeatInput) returns (TerminateSeatOutput);
}


