syntax = "proto3";

package operation.method.login1.power_off;

import "google/protobuf/descriptor.proto";
import "google/protobuf/struct.proto";

extend google.protobuf.MethodOptions {
  string plugin_subid = 50000;
  string required_capability = 50001;
}

message PowerOffInput {
  bool interactive = 1;
}

message PowerOffOutput {
  bool success = 1;
}

service PowerOffService {
  // subid: mut.software.login1.system.poweroff@v1, capability: login1.admin
  rpc power_off(PowerOffInput) returns (PowerOffOutput);
}
