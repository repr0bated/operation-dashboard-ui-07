syntax = "proto3";

package operation.method.workflows.pause_workflow;

import "google/protobuf/descriptor.proto";
import "google/protobuf/struct.proto";

extend google.protobuf.MethodOptions {
  string plugin_subid = 50000;
  string required_capability = 50001;
}

message PauseWorkflowInput {
  string workflow_id = 1;
}

message PauseWorkflowOutput {}

service PauseWorkflowService {
  // subid: mut.software.plugin.workflows.pause@v1, capability: workflows.write
  rpc pause_workflow(PauseWorkflowInput) returns (PauseWorkflowOutput);
}
