syntax = "proto3";

package operation.method.packagekit.resolve;

import "google/protobuf/descriptor.proto";
import "google/protobuf/struct.proto";

extend google.protobuf.MethodOptions {
  string plugin_subid = 50000;
  string required_capability = 50001;
}

message ResolveInput {
  int64 filter = 132212861;
  repeated string packages = 136677145;
}

message ResolveOutput {
  bool success = 442482449;
}

service ResolveService {
  // subid: obs.software.packagekit.package.resolve@v1, capability: packagekit.read
  rpc resolve(ResolveInput) returns (ResolveOutput);
}
