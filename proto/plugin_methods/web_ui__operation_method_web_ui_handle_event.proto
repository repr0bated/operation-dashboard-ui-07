syntax = "proto3";

package operation.method.web_ui.handle_event;

import "google/protobuf/descriptor.proto";
import "google/protobuf/struct.proto";

extend google.protobuf.MethodOptions {
  string plugin_subid = 50000;
  string required_capability = 50001;
}

message HandleEventInput {
  string event_type = 1;
  google.protobuf.Value payload = 2;
  string session_id = 3;
}

message HandleEventOutput {}

service HandleEventService {
  // subid: mut.software.plugin.web-ui.handle-event@v1, capability: ui.write
  rpc handle_event(HandleEventInput) returns (HandleEventOutput);
}
