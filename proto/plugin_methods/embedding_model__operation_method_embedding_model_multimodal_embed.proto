syntax = "proto3";

package operation.method.embedding_model.multimodal_embed;

import "google/protobuf/descriptor.proto";
import "google/protobuf/struct.proto";

extend google.protobuf.MethodOptions {
  string plugin_subid = 50000;
  string required_capability = 50001;
}

message MultimodalEmbedInput {
  google.protobuf.Value input_type = 1;
  repeated google.protobuf.Value inputs = 2;
  google.protobuf.Value output_encoding = 3;
  bool truncation = 4;
}

message MultimodalEmbedOutput {
  int64 image_pixels = 1;
  string model = 2;
  int64 text_tokens = 3;
  int64 total_tokens = 4;
  repeated double vectors = 5;
}

service MultimodalEmbedService {
  // subid: mut.service.embedding.multimodal-embed@v1, capability: embedding.invoke
  rpc multimodal_embed(MultimodalEmbedInput) returns (MultimodalEmbedOutput);
}
