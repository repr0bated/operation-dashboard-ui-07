syntax = "proto3";


package operation.method.netmaker.join_network;

import "google/protobuf/descriptor.proto";
import "google/protobuf/struct.proto";

extend google.protobuf.MethodOptions {
  string plugin_subid = 50000;
  string required_capability = 50001;
}

message JoinNetworkInput {
  string network = 1;
  string token = 2;
}

message JoinNetworkOutput {
  bool success = 1;
}

service JoinNetworkService {
  // subid: mut.network.netmaker.network.join@v1, capability: cap.network.netmaker.network.join@v1
  rpc join_network(JoinNetworkInput) returns (JoinNetworkOutput);
}


