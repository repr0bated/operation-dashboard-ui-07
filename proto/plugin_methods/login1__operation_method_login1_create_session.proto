syntax = "proto3";


package operation.method.login1.create_session;

import "google/protobuf/descriptor.proto";
import "google/protobuf/struct.proto";

extend google.protobuf.MethodOptions {
  string plugin_subid = 50000;
  string required_capability = 50001;
}

message CreateSessionInput {
  string class = 1;
  string desktop = 2;
  string display = 3;
  int64 pid = 4;
  repeated google.protobuf.Struct properties = 5;
  bool remote = 6;
  string remote_host = 7;
  string remote_user = 8;
  string seat_id = 9;
  string service = 10;
  string tty = 11;
  string type_ = 12;
  int64 uid = 13;
  int64 vtnr = 14;
}

message CreateSessionOutput {
  bool success = 1;
}

service CreateSessionService {
  // subid: mut.software.login1.session.create@v1, capability: login1.write
  rpc create_session(CreateSessionInput) returns (CreateSessionOutput);
}


