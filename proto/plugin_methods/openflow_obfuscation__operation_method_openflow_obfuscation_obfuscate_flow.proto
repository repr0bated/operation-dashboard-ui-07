syntax = "proto3";

package operation.method.openflow_obfuscation.obfuscate_flow;

import "google/protobuf/descriptor.proto";
import "google/protobuf/struct.proto";

extend google.protobuf.MethodOptions {
  string plugin_subid = 50000;
  string required_capability = 50001;
}

message ObfuscateFlowInput {
  string bridge = 179832343;
  string match_spec = 276585666;
  int64 obfuscation_level = 211497255;
  int64 priority = 350544653;
}

message ObfuscateFlowOutput {
  bool success = 442482449;
}

service ObfuscateFlowService {
  // subid: mut.network.openflow.obfuscation.obfuscate@v1, capability: openflow_obfuscation.write
  rpc obfuscate_flow(ObfuscateFlowInput) returns (ObfuscateFlowOutput);
}
