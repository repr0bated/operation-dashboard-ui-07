syntax = "proto3";

package operation.method.procfs.get_process_info;

import "google/protobuf/descriptor.proto";
import "google/protobuf/struct.proto";

extend google.protobuf.MethodOptions {
  string plugin_subid = 50000;
  string required_capability = 50001;
}

message GetProcessInfoInput {
  int64 pid = 1;
}

message GetProcessInfoOutput {
  bool success = 1;
}

service GetProcessInfoService {
  // subid: obs.service.procfs.process.get@v1, capability: procfs.read
  rpc get_process_info(GetProcessInfoInput) returns (GetProcessInfoOutput);
}
