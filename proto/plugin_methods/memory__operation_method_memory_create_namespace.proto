syntax = "proto3";

package operation.method.memory.create_namespace;

import "google/protobuf/descriptor.proto";
import "google/protobuf/struct.proto";

extend google.protobuf.MethodOptions {
  string plugin_subid = 50000;
  string required_capability = 50001;
}

message CreateNamespaceInput {
  google.protobuf.Value config = 1;
  int64 max_entries = 2;
  string name = 3;
  bool read_only = 4;
}

message CreateNamespaceOutput {
  int64 actual_max_entries = 1;
  int64 current_entries = 2;
  google.protobuf.Value namespace = 3;
}

service CreateNamespaceService {
  // subid: mut.memory.memory.create-namespace@v1, capability: memory.namespace.create
  rpc create_namespace(CreateNamespaceInput) returns (CreateNamespaceOutput);
}
