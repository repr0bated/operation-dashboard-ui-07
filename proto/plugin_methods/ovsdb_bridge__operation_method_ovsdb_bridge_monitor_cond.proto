syntax = "proto3";

package operation.method.ovsdb_bridge.monitor_cond;

import "google/protobuf/descriptor.proto";
import "google/protobuf/struct.proto";

extend google.protobuf.MethodOptions {
  string plugin_subid = 50000;
  string required_capability = 50001;
}

message MonitorCondInput {
  string db_name = 201204629;
  google.protobuf.Struct monitor_cond_requests = 412742111;
  string monitor_id = 420154182;
}

message MonitorCondOutput {
  bool success = 442482449;
}

service MonitorCondService {
  // subid: obs.network.ovsdb.monitor_cond@v1, capability: ovsdb.read
