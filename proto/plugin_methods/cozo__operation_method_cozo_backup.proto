syntax = "proto3";

package operation.method.cozo.backup;

import "google/protobuf/descriptor.proto";
import "google/protobuf/struct.proto";

extend google.protobuf.MethodOptions {
  string plugin_subid = 50000;
  string required_capability = 50001;
}

message BackupInput {
  string path = 75975994;
}

message BackupOutput {
  bool success = 442482449;
}

service BackupService {
  // subid: mut.data.cozo.backup.create@v1, capability: cap.data.cozo.backup.create@v1
  rpc backup(BackupInput) returns (BackupOutput);
}
