syntax = "proto3";

package operation.method.freedesktop.set;

import "google/protobuf/descriptor.proto";
import "google/protobuf/struct.proto";

extend google.protobuf.MethodOptions {
  string plugin_subid = 50000;
  string required_capability = 50001;
}

message SetInput {
  string interface_name = 1;
  string property_name = 2;
  string value = 3;
}

message SetOutput {
  bool success = 1;
}

service SetService {
  // subid: mut.software.freedesktop.property.set@v1, capability: freedesktop.write
  rpc Set(SetInput) returns (SetOutput);
}
