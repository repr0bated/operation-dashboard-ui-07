syntax = "proto3";


package operation.method.pcidecl.enumerate_devices;

import "google/protobuf/descriptor.proto";
import "google/protobuf/struct.proto";

extend google.protobuf.MethodOptions {
  string plugin_subid = 50000;
  string required_capability = 50001;
}

message EnumerateDevicesInput {
  string class_code = 1;
  string vendor_id = 2;
}

message EnumerateDevicesOutput {
  bool success = 1;
}

service EnumerateDevicesService {
  // subid: obs.hardware.pci.devices.enumerate@v1, capability: pcidecl.read
  rpc enumerate_devices(EnumerateDevicesInput) returns (EnumerateDevicesOutput);
}


