syntax = "proto3";


package operation.method.workflows.resume_workflow;

import "google/protobuf/descriptor.proto";
import "google/protobuf/struct.proto";

extend google.protobuf.MethodOptions {
  string plugin_subid = 50000;
  string required_capability = 50001;
}

message ResumeWorkflowInput {
  string workflow_id = 1;
}

message ResumeWorkflowOutput {
  bool success = 1;
}

service ResumeWorkflowService {
  // subid: mut.software.plugin.workflows.resume@v1, capability: workflows.write
  rpc resume_workflow(ResumeWorkflowInput) returns (ResumeWorkflowOutput);
}


