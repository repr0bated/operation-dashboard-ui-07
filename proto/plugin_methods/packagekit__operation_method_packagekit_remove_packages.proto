syntax = "proto3";

package operation.method.packagekit.remove_packages;

import "google/protobuf/descriptor.proto";
import "google/protobuf/struct.proto";

extend google.protobuf.MethodOptions {
  string plugin_subid = 50000;
  string required_capability = 50001;
}

message RemovePackagesInput {
  bool allow_deps = 458790589;
  bool autoremove = 312482772;
  repeated string package_ids = 323424029;
  int64 transaction_flags = 20962926;
}

message RemovePackagesOutput {
  bool success = 442482449;
}

service RemovePackagesService {
  // subid: mut.software.packagekit.package.remove@v1, capability: packagekit.admin
  rpc remove_packages(RemovePackagesInput) returns (RemovePackagesOutput);
}
