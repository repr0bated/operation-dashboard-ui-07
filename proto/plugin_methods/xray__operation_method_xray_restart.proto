syntax = "proto3";

package operation.method.xray.restart;

import "google/protobuf/descriptor.proto";
import "google/protobuf/struct.proto";

extend google.protobuf.MethodOptions {
  string plugin_subid = 50000;
  string required_capability = 50001;
}

message RestartInput {
  // Empty schema object.
}

message RestartOutput {
  repeated int64 reloaded_pids = 380060281;
}

service RestartService {
  // subid: mut.software.plugin.xray.daemon.restart@v1, capability: xray.write
  rpc restart(RestartInput) returns (RestartOutput);
}
