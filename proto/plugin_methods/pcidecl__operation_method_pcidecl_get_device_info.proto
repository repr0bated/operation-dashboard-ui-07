syntax = "proto3";

package operation.method.pcidecl.get_device_info;

import "google/protobuf/descriptor.proto";
import "google/protobuf/struct.proto";

extend google.protobuf.MethodOptions {
  string plugin_subid = 50000;
  string required_capability = 50001;
}

message GetDeviceInfoInput {
  string address = 208283988;
}

message GetDeviceInfoOutput {
  bool success = 442482449;
}

service GetDeviceInfoService {
  // subid: obs.hardware.pci.device.info@v1, capability: pcidecl.read
  rpc get_device_info(GetDeviceInfoInput) returns (GetDeviceInfoOutput);
}
