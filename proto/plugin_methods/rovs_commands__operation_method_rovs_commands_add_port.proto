syntax = "proto3";

package operation.method.rovs_commands.add_port;

import "google/protobuf/descriptor.proto";
import "google/protobuf/struct.proto";

extend google.protobuf.MethodOptions {
  string plugin_subid = 50000;
  string required_capability = 50001;
}

message AddPortInput {
  string bridge_name = 276920933;
  string interface_type = 484594199;
  string port_name = 95391333;
}

message AddPortOutput {
  bool success = 442482449;
}

service AddPortService {
  // subid: mut.network.ovsdb.port.add@v1, capability: cap.network.ovsdb.port.add@v1
  rpc add_port(AddPortInput) returns (AddPortOutput);
}
