syntax = "proto3";

package operation.method.netmaker.get_node;

import "google/protobuf/descriptor.proto";
import "google/protobuf/struct.proto";

extend google.protobuf.MethodOptions {
  string plugin_subid = 50000;
  string required_capability = 50001;
}

message GetNodeInput {
  string network = 303597255;
  string node_id = 169140144;
}

message GetNodeOutput {
  bool success = 442482449;
}

service GetNodeService {
  // subid: obs.network.netmaker.node.get@v1, capability: cap.network.netmaker.node.get@v1
  rpc get_node(GetNodeInput) returns (GetNodeOutput);
}
