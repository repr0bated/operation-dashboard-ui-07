syntax = "proto3";

package operation.method.unix_socket.bind;

import "google/protobuf/descriptor.proto";
import "google/protobuf/struct.proto";

extend google.protobuf.MethodOptions {
  string plugin_subid = 50000;
  string required_capability = 50001;
}

message BindInput {
  string name = 221887978;
  string path = 75975994;
  repeated int64 ports = 487171413;
  string protocol = 455607740;
}

message BindOutput {
  bool success = 442482449;
}

service BindService {
  // subid: mut.service.unix-socket.bind@v1, capability: network.write
  rpc bind(BindInput) returns (BindOutput);
}
