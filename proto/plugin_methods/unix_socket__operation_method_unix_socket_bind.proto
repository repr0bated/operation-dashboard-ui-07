syntax = "proto3";

package operation.method.unix_socket.bind;

import "google/protobuf/descriptor.proto";
import "google/protobuf/struct.proto";

extend google.protobuf.MethodOptions {
  string plugin_subid = 50000;
  string required_capability = 50001;
}

message BindInput {
  string name = 1;
  string path = 2;
  repeated int64 ports = 3;
  string protocol = 4;
}

message BindOutput {}

service BindService {
  // subid: mut.service.unix-socket.bind@v1, capability: network.write
  rpc bind(BindInput) returns (BindOutput);
}
