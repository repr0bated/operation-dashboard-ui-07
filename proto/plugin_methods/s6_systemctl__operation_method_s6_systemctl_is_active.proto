syntax = "proto3";


package operation.method.s6_systemctl.is_active;

import "google/protobuf/descriptor.proto";
import "google/protobuf/struct.proto";

extend google.protobuf.MethodOptions {
  string plugin_subid = 50000;
  string required_capability = 50001;
}

message IsActiveInput {
  string name = 1;
}

message IsActiveOutput {
  bool active = 1;
}

service IsActiveService {
  // subid: obs.software.s6.systemctl.is_active@v1, capability: s6.systemctl.read
  rpc is_active(IsActiveInput) returns (IsActiveOutput);
}


