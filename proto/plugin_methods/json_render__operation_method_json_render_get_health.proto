syntax = "proto3";

package operation.method.json_render.get_health;

import "google/protobuf/descriptor.proto";
import "google/protobuf/struct.proto";

extend google.protobuf.MethodOptions {
  string plugin_subid = 50000;
  string required_capability = 50001;
}

message GetHealthInput {
  // Empty schema object.
}

message GetHealthOutput {
  int64 action_count = 1;
  int64 component_count = 2;
  int64 package_count = 3;
  string source_commit = 4;
  string status = 5;
}

service GetHealthService {
  // subid: obs.software.plugin.json-render.health@v1, capability: json_render.read
  rpc get_health(GetHealthInput) returns (GetHealthOutput);
}
