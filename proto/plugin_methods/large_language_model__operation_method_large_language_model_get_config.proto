syntax = "proto3";

package operation.method.large_language_model.get_config;

import "google/protobuf/descriptor.proto";
import "google/protobuf/struct.proto";

extend google.protobuf.MethodOptions {
  string plugin_subid = 50000;
  string required_capability = 50001;
}

message GetConfigInput {
  // Empty schema object.
}

message GetConfigOutput {
  google.protobuf.Value config = 1;
}

service GetConfigService {
  // subid: obs.service.llm.config.get@v1, capability: llm.read
  rpc get_config(GetConfigInput) returns (GetConfigOutput);
}
