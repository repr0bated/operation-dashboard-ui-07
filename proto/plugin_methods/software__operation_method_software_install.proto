syntax = "proto3";

package operation.method.software.install;

import "google/protobuf/descriptor.proto";
import "google/protobuf/struct.proto";

extend google.protobuf.MethodOptions {
  string plugin_subid = 50000;
  string required_capability = 50001;
}

message InstallInput {
  string name = 1;
  string version = 2;
}

message InstallOutput {}

service InstallService {
  // subid: mut.software.plugin.software.install@v1, capability: software.write
  rpc install(InstallInput) returns (InstallOutput);
}
