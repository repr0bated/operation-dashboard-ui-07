syntax = "proto3";

package operation.method.service.run;

import "google/protobuf/descriptor.proto";
import "google/protobuf/struct.proto";

extend google.protobuf.MethodOptions {
  string plugin_subid = 50000;
  string required_capability = 50001;
}

message RunInput {
  repeated string args = 487237440;
  string name = 221887978;
}

message RunOutput {
  bool success = 442482449;
}

service RunService {
  // subid: mut.service.lifecycle.run@v1, capability: cap.service.lifecycle.run@v1
  rpc run(RunInput) returns (RunOutput);
}
