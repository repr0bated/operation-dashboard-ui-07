syntax = "proto3";

package operation.method.incus.exec_instance;

import "google/protobuf/descriptor.proto";
import "google/protobuf/struct.proto";

extend google.protobuf.MethodOptions {
  string plugin_subid = 50000;
  string required_capability = 50001;
}

message ExecInstanceInput {
  repeated string command = 324618934;
  string name = 221887978;
}

message ExecInstanceOutput {
  bool success = 442482449;
}

service ExecInstanceService {
  // subid: mut.service.incus.instance.exec@v1, capability: cap.service.incus.instance.exec@v1
  rpc exec_instance(ExecInstanceInput) returns (ExecInstanceOutput);
}
