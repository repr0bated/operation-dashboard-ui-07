syntax = "proto3";

package operation.method.freedesktop.get;

import "google/protobuf/descriptor.proto";
import "google/protobuf/struct.proto";

extend google.protobuf.MethodOptions {
  string plugin_subid = 50000;
  string required_capability = 50001;
}

message GetInput {
  string interface_name = 518035138;
  string property_name = 496618199;
}

message GetOutput {
  bool success = 442482449;
}

service GetService {
  // subid: obs.software.freedesktop.property.get@v1, capability: freedesktop.read
  rpc Get(GetInput) returns (GetOutput);
}
