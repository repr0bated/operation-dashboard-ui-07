syntax = "proto3";

package operation.method.mail_server.remove_mailbox;

import "google/protobuf/descriptor.proto";
import "google/protobuf/struct.proto";

extend google.protobuf.MethodOptions {
  string plugin_subid = 50000;
  string required_capability = 50001;
}

message RemoveMailboxInput {
  string domain = 1;
  string user = 2;
}

message RemoveMailboxOutput {
  bool success = 1;
}

service RemoveMailboxService {
  // subid: mut.service.mail.mailbox.remove@v1, capability: mail.write
  rpc remove_mailbox(RemoveMailboxInput) returns (RemoveMailboxOutput);
}
