syntax = "proto3";

package operation.method.login1.sleep;

import "google/protobuf/descriptor.proto";
import "google/protobuf/struct.proto";

extend google.protobuf.MethodOptions {
  string plugin_subid = 50000;
  string required_capability = 50001;
}

message SleepInput {
  int64 sleep_operation = 264718967;
}

message SleepOutput {
  bool success = 442482449;
}

service SleepService {
  // subid: mut.software.login1.system.sleep@v1, capability: login1.admin
  rpc sleep(SleepInput) returns (SleepOutput);
}
