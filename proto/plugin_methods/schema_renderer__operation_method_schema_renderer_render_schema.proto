syntax = "proto3";

package operation.method.schema_renderer.render_schema;

import "google/protobuf/descriptor.proto";
import "google/protobuf/struct.proto";

extend google.protobuf.MethodOptions {
  string plugin_subid = 50000;
  string required_capability = 50001;
}

message RenderSchemaInput {
  // Empty schema object.
}

message RenderSchemaOutput {
  google.protobuf.Value rendering = 1;
}

service RenderSchemaService {
  // subid: obs.service.schema.renderer.render@v1, capability: schema_renderer.read
  rpc render_schema(RenderSchemaInput) returns (RenderSchemaOutput);
}
