syntax = "proto3";

package operation.method.s6_systemctl.enable;

import "google/protobuf/descriptor.proto";
import "google/protobuf/struct.proto";

extend google.protobuf.MethodOptions {
  string plugin_subid = 50000;
  string required_capability = 50001;
}

message EnableInput {
  string name = 1;
}

message EnableOutput {}

service EnableService {
  // subid: mut.software.s6.systemctl.enable@v1, capability: s6.systemctl.write
  rpc enable(EnableInput) returns (EnableOutput);
}
