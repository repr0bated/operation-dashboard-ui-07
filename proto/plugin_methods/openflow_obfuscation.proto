syntax = "proto3";

package operation.method.openflow_obfuscation.obfuscate_flow;

import "google/protobuf/descriptor.proto";
import "google/protobuf/struct.proto";

extend google.protobuf.MethodOptions {
  string plugin_subid = 50000;
  string required_capability = 50001;
}

message ObfuscateFlowInput {
  string bridge = 1;
  string match_spec = 2;
  int64 obfuscation_level = 3;
  int64 priority = 4;
}

message ObfuscateFlowOutput {
  bool success = 1;
}

service ObfuscateFlowService {
  // subid: mut.network.openflow.obfuscation.obfuscate@v1, capability: openflow_obfuscation.write
  rpc obfuscate_flow(ObfuscateFlowInput) returns (ObfuscateFlowOutput);
}


syntax = "proto3";

package operation.method.openflow_obfuscation.deobfuscate_flow;

import "google/protobuf/descriptor.proto";
import "google/protobuf/struct.proto";

extend google.protobuf.MethodOptions {
  string plugin_subid = 50000;
  string required_capability = 50001;
}

message DeobfuscateFlowInput {
  string bridge = 1;
  string match_spec = 2;
}

message DeobfuscateFlowOutput {
  bool success = 1;
}

service DeobfuscateFlowService {
  // subid: mut.network.openflow.obfuscation.deobfuscate@v1, capability: openflow_obfuscation.write
  rpc deobfuscate_flow(DeobfuscateFlowInput) returns (DeobfuscateFlowOutput);
}


