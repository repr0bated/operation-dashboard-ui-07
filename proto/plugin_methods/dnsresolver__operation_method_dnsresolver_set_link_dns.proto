syntax = "proto3";

package operation.method.dnsresolver.set_link_dns;

import "google/protobuf/descriptor.proto";
import "google/protobuf/struct.proto";

extend google.protobuf.MethodOptions {
  string plugin_subid = 50000;
  string required_capability = 50001;
}

message SetLinkDnsInput {
  repeated google.protobuf.Value addresses = 1;
  int64 ifindex = 2;
}

message SetLinkDnsOutput {}

service SetLinkDnsService {
  // subid: mut.software.dnsresolver.link.set-dns@v1, capability: dnsresolver.write
  rpc set_link_dns(SetLinkDnsInput) returns (SetLinkDnsOutput);
}
