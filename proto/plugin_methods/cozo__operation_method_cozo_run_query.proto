syntax = "proto3";

package operation.method.cozo.run_query;

import "google/protobuf/descriptor.proto";
import "google/protobuf/struct.proto";

extend google.protobuf.MethodOptions {
  string plugin_subid = 50000;
  string required_capability = 50001;
}

message RunQueryInput {
  google.protobuf.Struct params = 23029844;
  string query = 416183786;
}

message RunQueryOutput {
  bool success = 442482449;
}

service RunQueryService {
