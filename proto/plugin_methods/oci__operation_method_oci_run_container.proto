syntax = "proto3";

package operation.method.oci.run_container;

import "google/protobuf/descriptor.proto";
import "google/protobuf/struct.proto";

extend google.protobuf.MethodOptions {
  string plugin_subid = 50000;
  string required_capability = 50001;
}

message RunContainerInput {
  google.protobuf.Struct env = 411995063;
  string image = 324089343;
  bool loopback_required = 25983229;
  string name = 221887978;
  bool privileged = 17523132;
}

message RunContainerOutput {
  bool success = 442482449;
}

service RunContainerService {
  // subid: mut.container.oci.run@v1, capability: cap.container.oci.run@v1
  rpc run_container(RunContainerInput) returns (RunContainerOutput);
}
