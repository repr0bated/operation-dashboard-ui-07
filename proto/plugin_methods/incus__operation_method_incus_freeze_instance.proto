syntax = "proto3";

package operation.method.incus.freeze_instance;

import "google/protobuf/descriptor.proto";
import "google/protobuf/struct.proto";

extend google.protobuf.MethodOptions {
  string plugin_subid = 50000;
  string required_capability = 50001;
}

message FreezeInstanceInput {
  string name = 1;
}

message FreezeInstanceOutput {}

service FreezeInstanceService {
  // subid: mut.service.incus.instance.freeze@v1, capability: cap.service.incus.instance.freeze@v1
  rpc freeze_instance(FreezeInstanceInput) returns (FreezeInstanceOutput);
}
