syntax = "proto3";

package operation.method.incus.snapshot_instance;

import "google/protobuf/descriptor.proto";
import "google/protobuf/struct.proto";

extend google.protobuf.MethodOptions {
  string plugin_subid = 50000;
  string required_capability = 50001;
}

message SnapshotInstanceInput {
  string name = 221887978;
  string snapshot_name = 418348540;
}

message SnapshotInstanceOutput {
  bool success = 442482449;
}

service SnapshotInstanceService {
  // subid: mut.service.incus.instance.snapshot@v1, capability: cap.service.incus.instance.snapshot@v1
  rpc snapshot_instance(SnapshotInstanceInput) returns (SnapshotInstanceOutput);
}
