syntax = "proto3";

package operation.method.oci.start;

import "google/protobuf/descriptor.proto";
import "google/protobuf/struct.proto";

extend google.protobuf.MethodOptions {
  string plugin_subid = 50000;
  string required_capability = 50001;
}

message StartInput {
  string id = 389573345;
}

message StartOutput {
  bool success = 442482449;
}

service StartService {
  // subid: mut.container.oci.start@v1, capability: cap.container.oci.start@v1
  rpc start(StartInput) returns (StartOutput);
}
