syntax = "proto3";


package operation.method.zeroclaw.setmodel;

import "google/protobuf/descriptor.proto";
import "google/protobuf/struct.proto";

extend google.protobuf.MethodOptions {
  string plugin_subid = 50000;
  string required_capability = 50001;
}

message SetModelInput {
  string model_id = 1;
}

message SetModelOutput {
  string selected_model = 1;
}

service SetModelService {
  // subid: mut.service.zeroclaw.model.set@v1, capability: cap.software.zeroclaw.model.set@v1
  rpc SetModel(SetModelInput) returns (SetModelOutput);
}


