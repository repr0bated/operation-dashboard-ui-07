import "google/protobuf/struct.proto";

extend google.protobuf.MethodOptions {
  string plugin_subid = 50000;
  string required_capability = 50001;
}

message RunInput {
  repeated string args = 1;
  string name = 2;
}

message RunOutput {
  bool success = 1;
}

service RunService {
  // subid: mut.service.lifecycle.run@v1, capability: cap.service.lifecycle.run@v1
  rpc run(RunInput) returns (RunOutput);
}


syntax = "proto3";

