syntax = "proto3";

package operation.method.service.init;

import "google/protobuf/descriptor.proto";
import "google/protobuf/struct.proto";

extend google.protobuf.MethodOptions {
  string plugin_subid = 50000;
  string required_capability = 50001;
}

message InitInput {
  string name = 1;
  string service_type = 2;
}

message InitOutput {
  bool success = 1;
}

service InitService {
  // subid: mut.service.lifecycle.init@v1, capability: cap.service.lifecycle.init@v1
  rpc init(InitInput) returns (InitOutput);
}


syntax = "proto3";

package operation.method.service.run;

