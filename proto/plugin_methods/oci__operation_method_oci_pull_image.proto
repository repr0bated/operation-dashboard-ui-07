syntax = "proto3";


package operation.method.oci.pull_image;

import "google/protobuf/descriptor.proto";
import "google/protobuf/struct.proto";

extend google.protobuf.MethodOptions {
  string plugin_subid = 50000;
  string required_capability = 50001;
}

message PullImageInput {
  string image = 1;
}

message PullImageOutput {
  bool success = 1;
}

service PullImageService {
  // subid: mut.container.oci.image.pull@v1, capability: cap.container.oci.image.pull@v1
  rpc pull_image(PullImageInput) returns (PullImageOutput);
}


