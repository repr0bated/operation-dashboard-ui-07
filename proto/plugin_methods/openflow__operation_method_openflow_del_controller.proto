syntax = "proto3";

package operation.method.openflow.del_controller;

import "google/protobuf/descriptor.proto";
import "google/protobuf/struct.proto";

extend google.protobuf.MethodOptions {
  string plugin_subid = 50000;
  string required_capability = 50001;
}

message DelControllerInput {
  string bridge = 179832343;
}

message DelControllerOutput {
  bool success = 442482449;
}

service DelControllerService {
  // subid: mut.network.openflow.datapath.del_controller@v1, capability: openflow.write
  rpc del_controller(DelControllerInput) returns (DelControllerOutput);
}
