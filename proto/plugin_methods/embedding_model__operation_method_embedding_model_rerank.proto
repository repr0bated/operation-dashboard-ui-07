syntax = "proto3";

package operation.method.embedding_model.rerank;

import "google/protobuf/descriptor.proto";
import "google/protobuf/struct.proto";

extend google.protobuf.MethodOptions {
  string plugin_subid = 50000;
  string required_capability = 50001;
}

message RerankInput {
  repeated string documents = 9443301;
  string model = 277571167;
  string query = 416183786;
  bool return_documents = 408703316;
  int64 top_k = 314004796;
  bool truncation = 98888562;
}

message RerankOutput {
  string model = 277571167;
  repeated google.protobuf.Value results = 206523128;
  int64 total_tokens = 20838375;
}

service RerankService {
  // subid: mut.service.embedding.rerank@v1, capability: embedding.invoke
  rpc rerank(RerankInput) returns (RerankOutput);
}
