syntax = "proto3";

package operation.method.incus.add_device;

import "google/protobuf/descriptor.proto";
import "google/protobuf/struct.proto";

extend google.protobuf.MethodOptions {
  string plugin_subid = 50000;
  string required_capability = 50001;
}

message AddDeviceInput {
  google.protobuf.Value device = 1;
  string device_name = 2;
  string instance_name = 3;
}

message AddDeviceOutput {
  bool success = 1;
}

service AddDeviceService {
  // subid: mut.service.incus.device.add@v1, capability: cap.service.incus.device.add@v1
  rpc add_device(AddDeviceInput) returns (AddDeviceOutput);
}
