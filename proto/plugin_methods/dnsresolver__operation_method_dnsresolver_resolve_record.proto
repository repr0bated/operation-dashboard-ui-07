syntax = "proto3";

package operation.method.dnsresolver.resolve_record;

import "google/protobuf/descriptor.proto";
import "google/protobuf/struct.proto";

extend google.protobuf.MethodOptions {
  string plugin_subid = 50000;
  string required_capability = 50001;
}

message ResolveRecordInput {
  int64 class = 188615684;
  int64 flags = 476543536;
  int64 ifindex = 394788143;
  string name = 221887978;
  int64 record_type = 77703365;
}

message ResolveRecordOutput {
  bool success = 442482449;
}

service ResolveRecordService {
  // subid: obs.software.dnsresolver.record.resolve@v1, capability: dnsresolver.read
  rpc resolve_record(ResolveRecordInput) returns (ResolveRecordOutput);
}
