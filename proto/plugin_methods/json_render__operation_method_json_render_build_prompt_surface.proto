syntax = "proto3";

package operation.method.json_render.build_prompt_surface;

import "google/protobuf/descriptor.proto";
import "google/protobuf/struct.proto";

extend google.protobuf.MethodOptions {
  string plugin_subid = 50000;
  string required_capability = 50001;
}

message BuildPromptSurfaceInput {
  repeated string custom_rules = 177887917;
  string mode = 208592921;
}

message BuildPromptSurfaceOutput {
  repeated string actions = 364201577;
  repeated string components = 469045609;
  string mode = 208592921;
  repeated string rules = 483376100;
}

service BuildPromptSurfaceService {
