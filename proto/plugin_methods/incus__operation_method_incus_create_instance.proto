syntax = "proto3";

package operation.method.incus.create_instance;

import "google/protobuf/descriptor.proto";
import "google/protobuf/struct.proto";

extend google.protobuf.MethodOptions {
  string plugin_subid = 50000;
  string required_capability = 50001;
}

message CreateInstanceInput {
  google.protobuf.Struct config = 67069640;
  repeated google.protobuf.Value devices = 17468293;
  string image = 324089343;
  string instance_type = 502815733;
  string name = 221887978;
  repeated string profiles = 115012907;
}

message CreateInstanceOutput {
  bool success = 442482449;
}

service CreateInstanceService {
  // subid: mut.service.incus.instance.create@v1, capability: cap.service.incus.instance.create@v1
  rpc create_instance(CreateInstanceInput) returns (CreateInstanceOutput);
}
