syntax = "proto3";

package operation.method.incus.create_instance;

import "google/protobuf/descriptor.proto";
import "google/protobuf/struct.proto";

extend google.protobuf.MethodOptions {
  string plugin_subid = 50000;
  string required_capability = 50001;
}

message CreateInstanceInput {
  google.protobuf.Struct config = 1;
  repeated google.protobuf.Value devices = 2;
  string image = 3;
  string instance_type = 4;
  string name = 5;
  repeated string profiles = 6;
}

message CreateInstanceOutput {}

service CreateInstanceService {
  // subid: mut.service.incus.instance.create@v1, capability: cap.service.incus.instance.create@v1
  rpc create_instance(CreateInstanceInput) returns (CreateInstanceOutput);
}
