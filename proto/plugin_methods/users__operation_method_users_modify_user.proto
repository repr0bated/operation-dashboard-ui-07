syntax = "proto3";

package operation.method.users.modify_user;

import "google/protobuf/descriptor.proto";
import "google/protobuf/struct.proto";

extend google.protobuf.MethodOptions {
  string plugin_subid = 50000;
  string required_capability = 50001;
}

message ModifyUserInput {
  repeated string add_groups = 56708579;
  int64 gid = 69916062;
  repeated string remove_groups = 178930083;
  string shell = 300022785;
  string username = 246355387;
}

message ModifyUserOutput {
  bool success = 442482449;
}

service ModifyUserService {
  // subid: mut.software.plugin.users.modify@v1, capability: users.write
  rpc modify_user(ModifyUserInput) returns (ModifyUserOutput);
}
