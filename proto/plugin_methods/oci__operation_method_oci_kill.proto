syntax = "proto3";


package operation.method.oci.kill;

import "google/protobuf/descriptor.proto";
import "google/protobuf/struct.proto";

extend google.protobuf.MethodOptions {
  string plugin_subid = 50000;
  string required_capability = 50001;
}

message KillInput {
  string id = 1;
  int64 signal = 2;
}

message KillOutput {
  bool success = 1;
}

service KillService {
  // subid: mut.container.oci.kill@v1, capability: cap.container.oci.kill@v1
  rpc kill(KillInput) returns (KillOutput);
}


