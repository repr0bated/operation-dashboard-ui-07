syntax = "proto3";

package operation.method.freedesktop.getall;

import "google/protobuf/descriptor.proto";
import "google/protobuf/struct.proto";

extend google.protobuf.MethodOptions {
  string plugin_subid = 50000;
  string required_capability = 50001;
}

message GetAllInput {
  string interface_name = 1;
}

message GetAllOutput {}

service GetAllService {
  // subid: obs.software.freedesktop.properties.getall@v1, capability: freedesktop.read
  rpc GetAll(GetAllInput) returns (GetAllOutput);
}
