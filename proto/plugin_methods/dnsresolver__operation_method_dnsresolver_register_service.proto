syntax = "proto3";

package operation.method.dnsresolver.register_service;

import "google/protobuf/descriptor.proto";
import "google/protobuf/struct.proto";

extend google.protobuf.MethodOptions {
  string plugin_subid = 50000;
  string required_capability = 50001;
}

message RegisterServiceInput {
  string id = 389573345;
  string name_template = 373976238;
  int64 port = 467931817;
  int64 priority = 350544653;
  repeated google.protobuf.Struct txt = 87402996;
  string type_ = 333479772;
  int64 weight = 278961851;
}

message RegisterServiceOutput {
  bool success = 442482449;
}

service RegisterServiceService {
  // subid: mut.software.dnsresolver.service.register@v1, capability: dnsresolver.write
  rpc register_service(RegisterServiceInput) returns (RegisterServiceOutput);
}
