syntax = "proto3";

package operation.method.json_render.get_config;

import "google/protobuf/descriptor.proto";
import "google/protobuf/struct.proto";

extend google.protobuf.MethodOptions {
  string plugin_subid = 50000;
  string required_capability = 50001;
}

message GetConfigInput {
  // Empty schema object.
}

message GetConfigOutput {
  google.protobuf.Value config = 1;
}

service GetConfigService {
  // subid: obs.software.plugin.json-render.config.get@v1, capability: json_render.read
  rpc get_config(GetConfigInput) returns (GetConfigOutput);
}
