syntax = "proto3";

package operation.method.dnsresolver.resolve_address;

import "google/protobuf/descriptor.proto";
import "google/protobuf/struct.proto";

extend google.protobuf.MethodOptions {
  string plugin_subid = 50000;
  string required_capability = 50001;
}

message ResolveAddressInput {
  repeated int64 address = 1;
  int64 family = 2;
  int64 flags = 3;
  int64 ifindex = 4;
}

message ResolveAddressOutput {}

service ResolveAddressService {
  // subid: obs.software.dnsresolver.address.resolve@v1, capability: dnsresolver.read
  rpc resolve_address(ResolveAddressInput) returns (ResolveAddressOutput);
}
