syntax = "proto3";

package operation.method.embedding_model.embed;

import "google/protobuf/descriptor.proto";
import "google/protobuf/struct.proto";

extend google.protobuf.MethodOptions {
  string plugin_subid = 50000;
  string required_capability = 50001;
}

message EmbedInput {
  google.protobuf.Value encoding_format = 1;
  google.protobuf.Value input_type = 2;
  int64 output_dimension = 3;
  google.protobuf.Value output_dtype = 4;
  repeated string texts = 5;
  bool truncation = 6;
}

message EmbedOutput {
  int64 dimensions = 1;
  string model = 2;
  int64 total_tokens = 3;
  repeated double vectors = 4;
}

service EmbedService {
  // subid: mut.service.embedding.embed@v1, capability: embedding.invoke
  rpc embed(EmbedInput) returns (EmbedOutput);
}
