syntax = "proto3";


package operation.method.openflow.delete_flow;

import "google/protobuf/descriptor.proto";
import "google/protobuf/struct.proto";

extend google.protobuf.MethodOptions {
  string plugin_subid = 50000;
  string required_capability = 50001;
}

message DeleteFlowInput {
  string bridge = 1;
  google.protobuf.Struct match_fields = 2;
}

message DeleteFlowOutput {
  bool success = 1;
}

service DeleteFlowService {
  // subid: mut.network.openflow.flow.delete@v1, capability: openflow.write
  rpc delete_flow(DeleteFlowInput) returns (DeleteFlowOutput);
}


