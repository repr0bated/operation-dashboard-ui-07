syntax = "proto3";


package operation.method.qdrant.list_snapshots;

import "google/protobuf/descriptor.proto";
import "google/protobuf/struct.proto";

extend google.protobuf.MethodOptions {
  string plugin_subid = 50000;
  string required_capability = 50001;
}

message ListSnapshotsInput {
  string collection_name = 1;
}

message ListSnapshotsOutput {
  repeated string snapshots = 1;
}

service ListSnapshotsService {
  // subid: obs.data.qdrant.snapshot.list@v1, capability: cap.data.qdrant.snapshot.list@v1
  rpc list_snapshots(ListSnapshotsInput) returns (ListSnapshotsOutput);
}


