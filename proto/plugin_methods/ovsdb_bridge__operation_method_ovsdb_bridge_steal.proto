syntax = "proto3";

package operation.method.ovsdb_bridge.steal;

import "google/protobuf/descriptor.proto";
import "google/protobuf/struct.proto";

extend google.protobuf.MethodOptions {
  string plugin_subid = 50000;
  string required_capability = 50001;
}

message StealInput {
  string lock_id = 308081002;
}

message StealOutput {
  bool success = 442482449;
}

service StealService {
  // subid: mut.network.ovsdb.lock.steal@v1, capability: ovsdb.write
  rpc steal(StealInput) returns (StealOutput);
}
