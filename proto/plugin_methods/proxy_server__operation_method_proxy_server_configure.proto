syntax = "proto3";

package operation.method.proxy_server.configure;

import "google/protobuf/descriptor.proto";
import "google/protobuf/struct.proto";

extend google.protobuf.MethodOptions {
  string plugin_subid = 50000;
  string required_capability = 50001;
}

message ConfigureInput {
  bool enabled = 49525662;
  string name = 221887978;
  int64 port = 467931817;
  string upstream = 322273216;
}

message ConfigureOutput {
  bool success = 442482449;
}

service ConfigureService {
  // subid: mut.network.proxy.configure@v1, capability: cap.network.proxy.configure@v1
  rpc configure(ConfigureInput) returns (ConfigureOutput);
}
