syntax = "proto3";


package operation.method.wireguard.set_config;

import "google/protobuf/descriptor.proto";
import "google/protobuf/struct.proto";

extend google.protobuf.MethodOptions {
  string plugin_subid = 50000;
  string required_capability = 50001;
}

message SetConfigInput {
  google.protobuf.Value config = 1;
  string interface = 2;
}

message SetConfigOutput {
  bool success = 1;
}

service SetConfigService {
  // subid: mut.network.wireguard.config.set@v1, capability: wireguard.write
  rpc set_config(SetConfigInput) returns (SetConfigOutput);
}


