syntax = "proto3";

package operation.method.json_render.list_components;

import "google/protobuf/descriptor.proto";
import "google/protobuf/struct.proto";

extend google.protobuf.MethodOptions {
  string plugin_subid = 50000;
  string required_capability = 50001;
}

message ListComponentsInput {
  // Empty schema object.
}

message ListComponentsOutput {
  repeated google.protobuf.Value components = 1;
}

service ListComponentsService {
  // subid: obs.software.plugin.json-render.component.list@v1, capability: json_render.read
  rpc list_components(ListComponentsInput) returns (ListComponentsOutput);
}
