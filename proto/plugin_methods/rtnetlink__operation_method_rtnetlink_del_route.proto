syntax = "proto3";

package operation.method.rtnetlink.del_route;

import "google/protobuf/descriptor.proto";
import "google/protobuf/struct.proto";

extend google.protobuf.MethodOptions {
  string plugin_subid = 50000;
  string required_capability = 50001;
}

message DelRouteInput {
  string destination = 1;
}

message DelRouteOutput {}

service DelRouteService {
  // subid: mut.network.rtnetlink.route.del@v1, capability: cap.network.rtnetlink.route.del@v1
  rpc del_route(DelRouteInput) returns (DelRouteOutput);
}
