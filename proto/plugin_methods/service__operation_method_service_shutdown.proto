syntax = "proto3";

package operation.method.service.shutdown;

import "google/protobuf/descriptor.proto";
import "google/protobuf/struct.proto";

extend google.protobuf.MethodOptions {
  string plugin_subid = 50000;
  string required_capability = 50001;
}

message ShutdownInput {
  bool force = 430540935;
  string name = 221887978;
}

message ShutdownOutput {
  bool success = 442482449;
}

service ShutdownService {
  // subid: mut.service.lifecycle.shutdown@v1, capability: cap.service.lifecycle.shutdown@v1
  rpc shutdown(ShutdownInput) returns (ShutdownOutput);
}
