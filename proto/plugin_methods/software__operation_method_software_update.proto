syntax = "proto3";

package operation.method.software.update;

import "google/protobuf/descriptor.proto";
import "google/protobuf/struct.proto";

extend google.protobuf.MethodOptions {
  string plugin_subid = 50000;
  string required_capability = 50001;
}

message UpdateInput {
  string name = 1;
  string version = 2;
}

message UpdateOutput {
  bool success = 1;
}

service UpdateService {
  // subid: mut.software.plugin.software.update@v1, capability: software.write
  rpc update(UpdateInput) returns (UpdateOutput);
}
