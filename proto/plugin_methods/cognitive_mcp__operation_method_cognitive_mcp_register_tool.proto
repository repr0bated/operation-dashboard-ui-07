syntax = "proto3";

package operation.method.cognitive_mcp.register_tool;

import "google/protobuf/descriptor.proto";
import "google/protobuf/struct.proto";

extend google.protobuf.MethodOptions {
  string plugin_subid = 50000;
  string required_capability = 50001;
}

message RegisterToolInput {
  // Empty schema object.
}

message RegisterToolOutput {string tool_name = 2;
}

service RegisterToolService {
  // subid: mut.service.cognitive-mcp.tool.register@v1, capability: cognitive_mcp.invoke
  rpc register_tool(RegisterToolInput) returns (RegisterToolOutput);
}
