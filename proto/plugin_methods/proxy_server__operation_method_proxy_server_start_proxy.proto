syntax = "proto3";

package operation.method.proxy_server.start_proxy;

import "google/protobuf/descriptor.proto";
import "google/protobuf/struct.proto";

extend google.protobuf.MethodOptions {
  string plugin_subid = 50000;
  string required_capability = 50001;
}

message StartProxyInput {
  string name = 221887978;
  int64 port = 467931817;
}

message StartProxyOutput {
  bool success = 442482449;
}

service StartProxyService {
  // subid: mut.network.proxy.start@v1, capability: cap.network.proxy.start@v1
  rpc start_proxy(StartProxyInput) returns (StartProxyOutput);
}
