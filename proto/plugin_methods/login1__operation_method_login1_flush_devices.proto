syntax = "proto3";


package operation.method.login1.flush_devices;

import "google/protobuf/descriptor.proto";
import "google/protobuf/struct.proto";

extend google.protobuf.MethodOptions {
  string plugin_subid = 50000;
  string required_capability = 50001;
}

message FlushDevicesInput {
  bool interactive = 1;
}

message FlushDevicesOutput {
  bool success = 1;
}

service FlushDevicesService {
  // subid: mut.software.login1.devices.flush@v1, capability: login1.admin
  rpc flush_devices(FlushDevicesInput) returns (FlushDevicesOutput);
}


