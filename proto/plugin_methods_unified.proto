  optional bool grpc_enabled = 11;
  optional bool healthy = 12;
  optional string http = 13;
  optional bool http_enabled = 14;
  optional google.protobuf.Struct memory_tool = 15;
  optional int64 notebook_count = 16;
  optional int64 queries_limit = 17;
  optional int64 queries_remaining = 18;
  optional bool running = 19;
  optional google.protobuf.Struct source_info = 20;
  optional string source_locator = 21;
  optional string source_system = 22;
  optional string wg_interface = 23;
