  repeated google.protobuf.Struct safety_settings = 12;
  optional string status = 13;
  optional google.protobuf.Struct structured_output = 14;
  repeated google.protobuf.Struct tools = 15;
  repeated google.protobuf.Struct ui_surfaces = 16;
  optional google.protobuf.Struct usage = 17;
