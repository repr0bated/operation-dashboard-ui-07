// =============================================
// ctl_plane_chatbot - Control-plane chatbot reasoning episodes — THE PLUGIN IS THE SCHEMA. Declares every episode field (REQ-2), PII tagging (REQ-8), significance classification (REQ-3), and vectorization pipeline config (REQ-4/5/6/7). Downstream (Qdrant, CozoDB, Accountability UI, EventChainService) inherits.
// =============================================

message CtlPlaneChatbot {
  optional string actor_id = 1;
  optional string capability_id = 2;
  optional string chat_model = 3;
  optional int64 dedup_window_hrs = 4;
  optional string embedding_plugin = 5;
  optional int64 embedding_queue_depth = 6;
  optional string input_type = 7;
  optional string last_vectorized_at = 8;
  optional string llm_plugin = 9;
  optional string nesting_policy = 10;
  optional string output_dtype = 11;
  optional string qdrant_collection = 12;
  optional int64 queue_alert_threshold = 13;
  optional bool reasoning_active = 14;
  optional google.protobuf.Struct reasoning_episode = 15;
  optional bool running = 16;
  optional google.protobuf.Struct significance = 17;
  optional string vector_dims = 18;
  optional string vector_id = 19;
  optional bool vectorization_enabled = 20;
}

message GetCtlPlaneChatbotRequest {
  string object_path = 1;
}
message GetCtlPlaneChatbotResponse {
  CtlPlaneChatbot state = 1;
  string error = 2;
}
message CtlPlaneChatbotUpdate {
  string object_path = 1;
  CtlPlaneChatbot state = 2;
}

service CtlPlaneChatbotService {
  rpc Get(GetCtlPlaneChatbotRequest) returns (GetCtlPlaneChatbotResponse);
}


