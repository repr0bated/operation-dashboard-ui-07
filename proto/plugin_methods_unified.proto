  string object_path = 1;
}
message GetCognitiveMcpResponse {
  CognitiveMcp state = 1;
  string error = 2;
}
message CognitiveMcpUpdate {
  string object_path = 1;
  CognitiveMcp state = 2;
}

service CognitiveMcpService {
  rpc Get(GetCognitiveMcpRequest) returns (GetCognitiveMcpResponse);
}


