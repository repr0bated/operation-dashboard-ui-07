syntax = "proto3";

package operation.catalog.v1;

import "google/protobuf/struct.proto";

// =============================================
// adc - Application default credentials state
// =============================================

message Adc {
  bool configured = 1;
}

message GetAdcRequest {
  string object_path = 1;
}
message GetAdcResponse {
  Adc state = 1;
  string error = 2;
}
message AdcUpdate {
  string object_path = 1;
  Adc state = 2;
}

service AdcService {
  rpc Get(GetAdcRequest) returns (GetAdcResponse);
}


// =============================================
// agent_config - Agent configuration and tool assignments
// =============================================

message AgentConfig {
  repeated google.protobuf.Struct agents = 1;
}

message GetAgentConfigRequest {
  string object_path = 1;
}
message GetAgentConfigResponse {
  AgentConfig state = 1;
  string error = 2;
}
message AgentConfigUpdate {
  string object_path = 1;
  AgentConfig state = 2;
}

service AgentConfigService {
  rpc Get(GetAgentConfigRequest) returns (GetAgentConfigResponse);
}


